name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK (official LunarG installer)
        shell: pwsh
        run: |
          $ver = "1.4.304.1"
          $exe = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "--root","C:\VulkanSDK\$ver","--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          if (!(Test-Path "C:\VulkanSDK\$ver\Bin\glslangValidator.exe")) { throw "Vulkan SDK install failed" }
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build (Release)
        run: cmake --build build --config Release --parallel
      - name: Unit + content tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package playable build
        shell: pwsh
        run: |
          $d = "dist\FARHORIZON"
          New-Item -ItemType Directory -Force -Path "$d\shaders" | Out-Null
          Copy-Item build\Release\farhorizon.exe $d
          Copy-Item build\shaders\*.spv "$d\shaders"
          Copy-Item -Recurse content "$d\content"
          Copy-Item packaging\PLAY.txt $d
          Copy-Item docs\DEPENDENCIES.md "$d\THIRD_PARTY.md"
          Get-ChildItem -Recurse $d | Measure-Object -Property Length -Sum
      - uses: actions/upload-artifact@v4
        with:
          name: FARHORIZON-windows-x64
          path: dist/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (Vulkan, lavapipe software GPU, Xvfb, X11 dev headers for SDL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libvulkan-dev mesa-vulkan-drivers \
            glslang-tools vulkan-validationlayers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
      - name: Configure (Debug + sanitizers)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFH_SANITIZERS=ON
      - name: Build
        run: cmake --build build
      - name: Unit + content tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke run (software Vulkan, validation on, screenshot)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          ASAN_OPTIONS: detect_leaks=0
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/farhorizon --frames 30 --validation --screenshot smoke.png
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/farhorizon --frames 20 --validation --start-in station --screenshot smoke_hangar.png
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/farhorizon --frames 20 --validation --start-in surface --screenshot smoke_surface.png
      - name: UI scripts (real input path through menus and terminal; failed expectations exit non-zero)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          ASAN_OPTIONS: detect_leaks=0
        run: |
          root="$PWD"
          for s in "options_rebind:" "terminal:--start-docked" "graphics_save:--start-docked" "full_stop:" "map_sample:--map $root/tests/data/derelict_fixture.glb" "foot_combat:--map $root/tests/data/derelict_fixture.glb" "derelict:--start-at station.derelict --start-in station"; do
            name="${s%%:*}"; flag="${s#*:}"
            dir="$root/ui_run/$name"; mkdir -p "$dir"; cd "$dir"
            # Ray-marched clouds are too slow on a software GPU for runs this long.
            echo '{"graphics":{"volumetricClouds":false}}' > settings.json
            xvfb-run -a -s "-screen 0 1920x1080x24" "$root/build/farhorizon" $flag --validation               --settings settings.json --ui-script "$root/tests/ui_scripts/$name.txt"
            cd "$root"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: |
            smoke.png
            smoke_hangar.png
            smoke_surface.png
            farhorizon.log
